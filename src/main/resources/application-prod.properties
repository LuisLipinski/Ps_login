server.port=${PORT:8084}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

clients.ps-user.url=${PS_USER_URL}
security.internal-key=${INTERNAL_API_KEY}
security.password.min-length=${PASSWORD_MIN_LENGTH:12}
security.jwt.secret=${JWT_SECRET_KEY}
security.jwt.issuer=${JWT_ISSUER:ps-login}
security.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
security.jwt.refresh-ttl=${JWT_REFRESH_TTL:P30D}

app.activation.url=${ACTIVATION_URL:http://localhost:3000/ativar-conta}
app.activation.ttl=${ACTIVATION_TOKEN_TTL:PT24H}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/redefinir-senha}
app.password-reset.ttl=${PASSWORD_RESET_TOKEN_TTL:PT30M}
app.mail.from=${MAIL_FROM:no-reply@mypetadmin.local}

# SMTP e opcional nesta fase. Sem provedor configurado o servico continua subindo,
# mas convite e recuperacao por e-mail nao devem ser utilizados ate a configuracao real.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read_only
management.health.mail.enabled=false

logging.level.root=INFO
logging.level.com.mypetadmin.ps_login=INFO
