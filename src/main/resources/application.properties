server.port=${PORT:8084}
spring.application.name=ps-login

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ps_login_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

clients.ps-user.url=${PS_USER_URL:http://localhost:8083}
security.internal-key=${INTERNAL_API_KEY:local-dev-only}
security.password.min-length=${PASSWORD_MIN_LENGTH:12}

app.activation.url=${ACTIVATION_URL:http://localhost:3000/ativar-conta}
app.activation.ttl=${ACTIVATION_TOKEN_TTL:PT24H}
app.mail.from=${MAIL_FROM:no-reply@mypetadmin.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read_only

logging.level.root=INFO
logging.level.com.mypetadmin.ps_login=INFO
