name: PS_Login Release

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 'URL pública do PS_Login no Render, sem barra final'
        required: true
        type: string

concurrency:
  group: ps-login-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate master branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/master" || {
            echo 'Release de produção deve ser executado a partir da master.'
            exit 1
          }
      - name: Build and quality gate
        run: mvn -B clean verify
      - name: Build container
        run: docker build -t ps-login:release .

  deploy-render:
    needs: validate-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deploy configuration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SERVICE_URL: ${{ inputs.service_url }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK" || {
            echo 'Secret RENDER_DEPLOY_HOOK não configurado.'
            exit 1
          }
          test -n "$SERVICE_URL" || {
            echo 'service_url não informado.'
            exit 1
          }

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for deployed commit
        env:
          SERVICE_URL: ${{ inputs.service_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RESPONSE=$(curl -fsS "$SERVICE_URL/version" || true)
            echo "attempt=$attempt deployed=$RESPONSE expected=$EXPECTED_COMMIT"
            if [ "$RESPONSE" = "$EXPECTED_COMMIT" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Timeout aguardando a versão esperada no Render.'
          exit 1

      - name: Production health smoke
        env:
          SERVICE_URL: ${{ inputs.service_url }}
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS "$SERVICE_URL/actuator/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"UP"'

  release-tag:
    needs: deploy-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          VERSION="ps-login-v1.${GITHUB_RUN_NUMBER}"
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          echo "Release criada: $VERSION"
